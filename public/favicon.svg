<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="BudAI">
  <title>BudAI</title>
  <defs>
    <linearGradient id="bFrame" x1="14" y1="8" x2="50" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8ef0e2"/><stop offset="0.46" stop-color="#3ee0cd"/><stop offset="1" stop-color="#9a86ff"/>
    </linearGradient>
    <linearGradient id="bStem" x1="21" y1="13" x2="21" y2="51" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#e8fffd"/><stop offset="1" stop-color="#c9c2ff"/>
    </linearGradient>
    <radialGradient id="bNode" cx="0.4" cy="0.36" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.55" stop-color="#9df6ea"/><stop offset="1" stop-color="#3ee0cd"/>
    </radialGradient>
    <style>
      @keyframes draw{from{stroke-dashoffset:140}to{stroke-dashoffset:0}}
      @keyframes orbit{to{transform:rotate(360deg)}}
      @keyframes breathe{0%,100%{opacity:.75;transform:scale(.94)}50%{opacity:1;transform:scale(1.06)}}
      .stem{stroke-dasharray:140;animation:draw .9s cubic-bezier(.22,1,.36,1) both}
      .bowl{stroke-dasharray:140;animation:draw 1s cubic-bezier(.22,1,.36,1) .12s both}
      .bowl2{stroke-dasharray:140;animation:draw 1s cubic-bezier(.22,1,.36,1) .24s both}
      .node{transform-origin:33px 32px;animation:orbit 9s linear infinite}
      .core{transform-origin:33px 32px;animation:breathe 3.6s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce){.stem,.bowl,.bowl2,.node,.core{animation:none}}
    </style>
  </defs>
  <rect width="64" height="64" rx="14" fill="#070a10"/>
  <ellipse cx="33" cy="32" rx="26" ry="24" fill="none" stroke="url(#bFrame)" stroke-width="0.7" stroke-dasharray="34 118" opacity="0.5"/>
  <path class="stem" d="M21 13 V51" stroke="url(#bStem)" stroke-width="6.2" stroke-linecap="round" fill="none"/>
  <path class="bowl" d="M21 13 H32.5 a11.5 11.5 0 0 1 0 23 H21" stroke="url(#bFrame)" stroke-width="6.2" stroke-linecap="round" fill="none"/>
  <path class="bowl2" d="M21 32 H32.5 a11.5 11.5 0 0 1 0 23 H21" stroke="url(#bFrame)" stroke-width="6.2" stroke-linecap="round" opacity="0.92" fill="none"/>
  <circle class="core" cx="33" cy="32" r="3.2" fill="url(#bNode)"/>
  <g class="node"><circle cx="59" cy="26" r="3" fill="url(#bNode)"/></g>
</svg>
