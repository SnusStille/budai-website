<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="BudAI">
  <defs>
    <linearGradient id="f" x1="8" y1="4" x2="56" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c9f9ff"/>
      <stop offset="34%" stop-color="#87e9df"/>
      <stop offset="76%" stop-color="#b9a8f6"/>
      <stop offset="100%" stop-color="#e9a5c5"/>
    </linearGradient>
    <linearGradient id="e" x1="20" y1="48" x2="46" y2="16" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#b9a8f6" stop-opacity="0.5"/>
      <stop offset="52%" stop-color="#c9f9ff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#87e9df" stop-opacity="0.6"/>
    </linearGradient>
    <radialGradient id="c" cx="34%" cy="28%" r="74%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="24%" stop-color="#eafffd"/>
      <stop offset="60%" stop-color="#7ce7dd"/>
      <stop offset="100%" stop-color="#7c6bf0"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#87e9df" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#87e9df" stop-opacity="0"/>
    </radialGradient>
    <filter id="g" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="15" fill="#070a0f"/>

  <!-- ambient bloom -->
  <circle cx="32" cy="32" r="24" fill="url(#glow)"/>

  <!-- outer prism -->
  <path d="M32 5.2 L55.4 18.6 V45.4 L32 58.8 L8.6 45.4 V18.6 Z"
        fill="rgba(135,233,223,0.045)" stroke="url(#f)" stroke-width="2.7" stroke-linejoin="round"/>

  <!-- inner facet ring -->
  <path d="M45.2 32 L38.6 43.4 H25.4 L18.8 32 L25.4 20.6 H38.6 Z"
        fill="rgba(135,233,223,0.05)" stroke="url(#e)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- scanner arc -->
  <path d="M32 16.9 A15.1 15.1 0 0 1 47.1 32" fill="none" stroke="#c9f9ff" stroke-opacity="0.55"
        stroke-width="1.4" stroke-linecap="round"/>

  <!-- core -->
  <circle cx="32" cy="32" r="7.3" fill="url(#c)" filter="url(#g)"/>
  <circle cx="32" cy="32" r="7.3" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="0.7"/>
  <circle cx="29.2" cy="29.3" r="2.3" fill="#ffffff" opacity="0.82"/>

  <!-- satellites -->
  <circle cx="47.1" cy="32" r="1.7" fill="#eafffd"/>
  <circle cx="16.9" cy="32" r="1.1" fill="#ddd6fe" opacity="0.85"/>
</svg>
