<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="BudAI">
  <title>BudAI</title>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f18"/><stop offset="0.55" stop-color="#060911"/><stop offset="1" stop-color="#0d1120"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9a86ff" stop-opacity="0.25"/>
      <stop offset="0.5" stop-color="#3ee0cd"/>
      <stop offset="1" stop-color="#c9f9ff" stop-opacity="0.35"/>
    </linearGradient>
    <radialGradient id="core" cx="0.42" cy="0.38" r="0.72">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.35" stop-color="#b8fff6"/><stop offset="1" stop-color="#3ee0cd"/>
    </radialGradient>
    <style>
      @keyframes fire{0%{stroke-dashoffset:62;opacity:.12}38%{stroke-dashoffset:0;opacity:1}72%{stroke-dashoffset:0;opacity:.72}100%{stroke-dashoffset:-62;opacity:.1}}
      @keyframes breathe{0%,100%{opacity:.62}50%{opacity:1}}
      @keyframes turn{to{transform:rotate(360deg)}}
      .spoke{animation:fire 2.8s ease-in-out infinite}
      .node{animation:breathe 2.8s ease-in-out infinite}
      .ring{transform-origin:100px 100px;animation:turn 34s linear infinite}
    </style>
  </defs>
  <rect x="4" y="4" width="192" height="192" rx="46" fill="url(#plate)" stroke="rgba(255,255,255,0.10)"/>
  <circle cx="100" cy="100" r="84" fill="none" stroke="rgba(255,255,255,0.07)"/>
  <g class="ring" stroke="url(#edge)" stroke-width="1.6" stroke-dasharray="10 6" opacity="0.55">
    <circle cx="100" cy="100" r="84" fill="none"/>
  </g>
  <g stroke="rgba(255,255,255,0.14)" stroke-width="1.4">
    <line x1="175.9" y1="100.0" x2="156.0" y2="100.0"/>
    <line x1="165.7" y1="129.5" x2="148.5" y2="119.5"/>
    <line x1="140.5" y1="149.7" x2="128.0" y2="132.5"/>
    <line x1="110.5" y1="158.6" x2="106.0" y2="138.0"/>
    <line x1="78.0" y1="157.5" x2="88.0" y2="138.0"/>
    <line x1="46.7" y1="134.3" x2="66.0" y2="124.0"/>
    <line x1="31.3" y1="73.5" x2="60.0" y2="88.0"/>
    <line x1="53.5" y1="41.9" x2="70.5" y2="69.5"/>
    <line x1="87.2" y1="29.8" x2="92.0" y2="57.0"/>
    <line x1="127.6" y1="33.3" x2="115.0" y2="61.5"/>
    <line x1="158.0" y1="60.0" x2="132.0" y2="76.0"/>
    <line x1="175.9" y1="100.0" x2="156.0" y2="100.0"/>
  </g>
  <g stroke-linecap="round" stroke-width="3">
    <line class="spoke" x1="100" y1="100" x2="156" y2="100" stroke="url(#edge)" style="animation-delay:0s"/>
    <line class="spoke" x1="100" y1="100" x2="128" y2="148.5" stroke="url(#edge)" style="animation-delay:.16s"/>
    <line class="spoke" x1="100" y1="100" x2="72" y2="148.5" stroke="url(#edge)" style="animation-delay:.32s"/>
    <line class="spoke" x1="100" y1="100" x2="44" y2="100" stroke="url(#edge)" style="animation-delay:.48s"/>
    <line class="spoke" x1="100" y1="100" x2="72" y2="51.5" stroke="url(#edge)" style="animation-delay:.64s"/>
    <line class="spoke" x1="100" y1="100" x2="128" y2="51.5" stroke="url(#edge)" style="animation-delay:.8s"/>
  </g>
  <g fill="#3ee0cd">
    <circle class="node" cx="156" cy="100" r="7" style="animation-delay:0s"/>
    <circle class="node" cx="128" cy="148.5" r="7" fill="#9a86ff" style="animation-delay:.22s"/>
    <circle class="node" cx="72" cy="148.5" r="7" style="animation-delay:.44s"/>
    <circle class="node" cx="44" cy="100" r="7" fill="#9a86ff" style="animation-delay:.66s"/>
    <circle class="node" cx="72" cy="51.5" r="7" style="animation-delay:.88s"/>
    <circle class="node" cx="128" cy="51.5" r="7" fill="#9a86ff" style="animation-delay:1.1s"/>
  </g>
  <circle cx="100" cy="100" r="26" fill="none" stroke="rgba(62,224,205,0.35)" stroke-width="1.4"/>
  <circle cx="100" cy="100" r="17" fill="url(#core)"/>
  <circle cx="94" cy="94" r="5.4" fill="#ffffff" opacity="0.92"/>
</svg>
