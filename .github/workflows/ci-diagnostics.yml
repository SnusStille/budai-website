name: CI report diagnostics
on:
  push:
    branches: ["arena/0e259d5c-budai-website"]
permissions:
  actions: read
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Download previous browser report
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          run-id: 42411603144
          github-token: ${{ github.token }}
          path: ci-report
      - name: Summarize failing tests
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, io, json, re, zipfile
          from pathlib import Path
          html = next(Path('ci-report').rglob('index.html')).read_text(encoding='utf-8')
          match = re.search(r'data:application/zip;base64,([a-zA-Z0-9+/=]+)</template>', html)
          if not match:
              raise SystemExit('Could not find the embedded Playwright report')
          report = zipfile.ZipFile(io.BytesIO(base64.b64decode(match.group(1))))
          summary = json.loads(report.read('report.json'))
          print('::notice title=Report statistics::' + json.dumps(summary['stats']))
          for file in summary['files']:
              failed = [t for t in file['tests'] if t.get('outcome') == 'unexpected']
              if not failed:
                  continue
              details = json.loads(report.read(file['fileId'] + '.json'))
              for test in details['tests']:
                  if test.get('outcome') != 'unexpected':
                      continue
                  errors = [e.get('message', e.get('value', '')) for r in test.get('results', []) for e in r.get('errors', [])]
                  message = file['fileName'] + ' :: ' + test['title'] + ' :: ' + ' '.join(errors)
                  message = re.sub(r'\x1b\[[0-9;]*m', '', message)[:2500].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print('::warning title=Failed browser test::' + message)
          PY
