name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: secret scan · lint · typecheck · unit · build · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history is required by scripts/scan-secrets.mjs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # scripts/test-browser.mjs supplies Chromium via @sparticuz/chromium from npm,
      # so no separate `playwright install` step is needed.
      - name: Secret scan (working tree + full history)
        run: npm run scan:secrets

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # test:e2e starts `next start` against the existing .next build, so the
      # build must come BEFORE the browser suite (and again afterwards for the
      # delivered artifact). It runs every stable browser spec, not a subset.
      - name: Production build
        run: npm run build

      - name: Browser regression suite
        run: npm run test:e2e

      - name: Final production build
        run: npm run build

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
